<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f766e">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Sổ Chi Tiêu</title>
<style>
:root{
  --bg:#f4f6f5;--card:#fff;--text:#14201d;--muted:#6b7b76;--line:#e3e9e6;
  --brand:#0f766e;--brand-d:#0b5a54;--exp:#dc2626;--inc:#16a34a;--chip:#eef3f1;
}
@media (prefers-color-scheme:dark){
  :root{--bg:#0e1513;--card:#17211e;--text:#e8f0ed;--muted:#8fa19b;--line:#26332f;--brand:#14b8a6;--brand-d:#0f766e;--chip:#1f2c28;--exp:#f87171;--inc:#4ade80}
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,Roboto,"Segoe UI",sans-serif;font-size:16px}
body{padding-bottom:calc(88px + env(safe-area-inset-bottom))}
header{background:var(--brand);color:#fff;padding:calc(14px + env(safe-area-inset-top)) 16px 64px}
.month{display:flex;align-items:center;justify-content:space-between}
.month button{background:rgba(255,255,255,.18);border:0;color:#fff;width:40px;height:40px;border-radius:50%;font-size:20px}
.month h1{margin:0;font-size:18px;font-weight:600}
.balance{text-align:center;margin-top:14px}
.balance small{opacity:.85}
.balance .big{font-size:34px;font-weight:700;margin-top:2px}
.wrap{max-width:560px;margin:-44px auto 0;padding:0 14px}
.sum{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.box{background:var(--card);border-radius:16px;padding:14px;box-shadow:0 1px 3px rgba(0,0,0,.08)}
.box small{color:var(--muted)}
.box b{display:block;font-size:19px;margin-top:4px}
.inc{color:var(--inc)}.exp{color:var(--exp)}
.tabs{display:flex;gap:6px;margin:14px 0 10px;background:var(--chip);padding:4px;border-radius:12px}
.tabs button{flex:1;border:0;background:none;padding:10px;border-radius:9px;color:var(--muted);font-size:15px;font-weight:600}
.tabs button.on{background:var(--card);color:var(--text);box-shadow:0 1px 2px rgba(0,0,0,.1)}
.day{color:var(--muted);font-size:13px;margin:16px 4px 6px;display:flex;justify-content:space-between}
.item{background:var(--card);border-radius:14px;padding:12px 14px;margin-bottom:8px;display:flex;align-items:center;gap:12px}
.ico{width:42px;height:42px;border-radius:12px;background:var(--chip);display:grid;place-items:center;font-size:21px;flex:none}
.item .mid{flex:1;min-width:0}
.item .mid b{display:block;font-size:15px}
.item .mid span{color:var(--muted);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}
.item .amt{font-weight:700;font-size:15px;white-space:nowrap}
.empty{text-align:center;color:var(--muted);padding:40px 0}
.bar{margin:10px 0}
.bar .r{display:flex;justify-content:space-between;font-size:14px;margin-bottom:5px}
.bar .t{height:9px;background:var(--chip);border-radius:6px;overflow:hidden}
.bar .t i{display:block;height:100%;background:var(--brand);border-radius:6px}
.fab{position:fixed;right:18px;bottom:calc(18px + env(safe-area-inset-bottom));width:60px;height:60px;border-radius:50%;border:0;background:var(--brand);color:#fff;font-size:32px;box-shadow:0 6px 16px rgba(0,0,0,.3);z-index:5}
.sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;align-items:flex-end;justify-content:center;z-index:10}
.sheet-bg.show{display:flex}
.sheet{background:var(--card);width:100%;max-width:560px;border-radius:22px 22px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom));max-height:92vh;overflow:auto}
.sheet h2{margin:0 0 12px;font-size:18px}
.seg{display:flex;gap:6px;margin-bottom:12px}
.seg button{flex:1;padding:11px;border-radius:10px;border:2px solid var(--line);background:none;color:var(--text);font-weight:600;font-size:15px}
.seg button.on.e{border-color:var(--exp);color:var(--exp)}
.seg button.on.i{border-color:var(--inc);color:var(--inc)}
label{display:block;font-size:13px;color:var(--muted);margin:10px 0 5px}
input{width:100%;padding:13px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--text);font-size:16px}
input.money{font-size:26px;font-weight:700}
.cats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.cats button{border:2px solid transparent;background:var(--chip);border-radius:12px;padding:8px 2px;color:var(--text);font-size:11px;display:flex;flex-direction:column;align-items:center;gap:3px}
.cats button span{font-size:22px}
.cats button.on{border-color:var(--brand)}
.row{display:flex;gap:8px;margin-top:16px}
.row button{flex:1;padding:14px;border-radius:12px;border:0;font-size:16px;font-weight:700}
.save{background:var(--brand);color:#fff}
.del{background:var(--chip);color:var(--exp)}
.cancel{background:var(--chip);color:var(--text)}
.tools button{width:100%;text-align:left;padding:14px;border-radius:12px;border:0;background:var(--chip);color:var(--text);font-size:15px;margin-bottom:8px}
.gear{position:absolute;right:14px;top:calc(14px + env(safe-area-inset-top));display:none}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.top .gearb{background:rgba(255,255,255,.18);border:0;color:#fff;border-radius:20px;padding:8px 14px;font-size:14px}
.top b{font-size:16px}
</style>
</head>
<body>
<header>
  <div class="top"><b>💰 Sổ Chi Tiêu</b><button class="gearb" id="menuBtn">⋯ Menu</button></div>
  <div class="month"><button id="prev">‹</button><h1 id="mlabel"></h1><button id="next">›</button></div>
  <div class="balance"><small>Số dư tháng này</small><div class="big" id="bal"></div></div>
</header>

<div class="wrap">
  <div class="sum">
    <div class="box"><small>Thu nhập</small><b class="inc" id="sInc"></b></div>
    <div class="box"><small>Chi tiêu</small><b class="exp" id="sExp"></b></div>
  </div>
  <div class="tabs"><button id="t1" class="on">Giao dịch</button><button id="t2">Thống kê</button></div>
  <div id="list"></div>
  <div id="stats" style="display:none"></div>
</div>

<button class="fab" id="fab" aria-label="Thêm">+</button>

<div class="sheet-bg" id="bg">
  <div class="sheet">
    <h2 id="sTitle">Thêm giao dịch</h2>
    <div class="seg"><button class="e on" id="tE">Chi tiêu</button><button class="i" id="tI">Thu nhập</button></div>
    <label>Số tiền (₫)</label>
    <input class="money" id="amount" inputmode="numeric" placeholder="0" autocomplete="off">
    <label>Danh mục</label>
    <div class="cats" id="cats"></div>
    <label>Ghi chú</label>
    <input id="note" placeholder="Ví dụ: cơm trưa" autocomplete="off">
    <label>Ngày</label>
    <input type="date" id="date">
    <div class="row">
      <button class="del" id="delBtn" style="display:none">Xoá</button>
      <button class="cancel" id="cancel">Huỷ</button>
      <button class="save" id="save">Lưu</button>
    </div>
  </div>
</div>

<div class="sheet-bg" id="bg2">
  <div class="sheet tools">
    <h2>Menu</h2>
    <button id="cloudBtn">☁️ Đồng bộ đám mây</button>
    <button id="exCsv">📄 Xuất file CSV (mở bằng Excel)</button>
    <button id="exJson">💾 Sao lưu dữ liệu (JSON)</button>
    <button id="imJson">📥 Khôi phục từ file sao lưu</button>
    <button id="clearAll" style="color:var(--exp)">🗑️ Xoá toàn bộ dữ liệu</button>
    <div class="row"><button class="cancel" id="close2">Đóng</button></div>
    <input type="file" id="file" accept=".json" style="display:none">
  </div>
</div>

<div class="sheet-bg" id="bg3">
  <div class="sheet">
    <h2>☁️ Đồng bộ Google Sheets</h2>
    <p id="cloudInfo" style="color:var(--muted);font-size:14px;margin:0 0 8px"></p>
    <div id="authForm">
      <label>Link Apps Script (Web app URL)</label><input id="gUrl" placeholder="https://script.google.com/macros/s/.../exec" autocomplete="off" autocapitalize="off">
      <label>Mã bí mật (TOKEN)</label><input id="gTok" type="password" autocomplete="off">
      <div class="row"><button class="save" id="connBtn">Kết nối</button></div>
    </div>
    <div id="authOut" style="display:none"><div class="row"><button class="save" id="syncBtn">Đồng bộ ngay</button><button class="del" id="logoutBtn">Ngắt kết nối</button></div></div>
    <p id="cloudMsg" style="color:var(--muted);font-size:14px;min-height:18px"></p>
    <div class="row" style="margin-top:0"><button class="cancel" id="close3">Đóng</button></div>
  </div>
</div>

<script>
const EXP=[["🍜","Ăn uống"],["🛒","Chợ/Siêu thị"],["🚗","Đi lại"],["⛽","Xăng xe"],["🏠","Nhà ở"],["💡","Hoá đơn"],["🛍️","Mua sắm"],["🎬","Giải trí"],["💊","Sức khoẻ"],["📚","Học tập"],["🎁","Quà tặng"],["📦","Khác"]];
const INC=[["💼","Lương"],["🎯","Thưởng"],["📈","Đầu tư"],["🎁","Được cho"],["📦","Khác"]];
const KEY="so-chi-tieu-v1";
let data=[];try{data=JSON.parse(localStorage.getItem(KEY)||"[]")}catch(e){}
const $=id=>document.getElementById(id);
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(data))}catch(e){alert("Không lưu được dữ liệu!")}};
const fmt=n=>new Intl.NumberFormat("vi-VN").format(n)+" ₫";
const today=()=>{const d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")};
let cur=new Date();cur.setDate(1);
let type="e",catIdx=0,editId=null,tab=1;
const ym=()=>cur.getFullYear()+"-"+String(cur.getMonth()+1).padStart(2,"0");
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const cloud=(fn,...a)=>{try{if(window.cloud&&window.cloud.connected)window.cloud[fn](...a)}catch(e){console.error(e)}};
window.getLocalData=()=>data;
window.onCloudData=arr=>{data=arr;save();render()};
const catOf=(t,name)=>(t==="e"?EXP:INC).find(c=>c[1]===name)||["📦",name];

function render(){
  $("mlabel").textContent="Tháng "+(cur.getMonth()+1)+", "+cur.getFullYear();
  const m=data.filter(x=>x.date.startsWith(ym())).sort((a,b)=>b.date.localeCompare(a.date)||b.id-a.id);
  const inc=m.filter(x=>x.type==="i").reduce((s,x)=>s+x.amount,0);
  const exp=m.filter(x=>x.type==="e").reduce((s,x)=>s+x.amount,0);
  $("sInc").textContent=fmt(inc);$("sExp").textContent=fmt(exp);
  $("bal").textContent=fmt(inc-exp);
  // list
  let h="",last="";
  if(!m.length)h='<div class="empty">Chưa có giao dịch nào.<br>Bấm nút + để thêm.</div>';
  m.forEach(x=>{
    if(x.date!==last){
      last=x.date;
      const dayTotal=m.filter(y=>y.date===x.date).reduce((s,y)=>s+(y.type==="e"?-y.amount:y.amount),0);
      const [y,mo,d]=x.date.split("-");
      const wd=["CN","T2","T3","T4","T5","T6","T7"][new Date(x.date+"T00:00").getDay()];
      h+=`<div class="day"><span>${wd}, ${d}/${mo}/${y}</span><span>${dayTotal<0?"-":"+"}${fmt(Math.abs(dayTotal))}</span></div>`;
    }
    const c=catOf(x.type,x.cat);
    h+=`<div class="item" data-id="${x.id}"><div class="ico">${c[0]}</div><div class="mid"><b>${esc(x.cat)}</b><span>${esc(x.note||"—")}</span></div><div class="amt ${x.type==="e"?"exp":"inc"}">${x.type==="e"?"-":"+"}${fmt(x.amount)}</div></div>`;
  });
  $("list").innerHTML=h;
  // stats
  const by={};m.filter(x=>x.type==="e").forEach(x=>by[x.cat]=(by[x.cat]||0)+x.amount);
  const rows=Object.entries(by).sort((a,b)=>b[1]-a[1]);
  let s="";
  if(!rows.length)s='<div class="empty">Chưa có chi tiêu trong tháng này.</div>';
  else s='<div class="box">'+rows.map(([k,v])=>`<div class="bar"><div class="r"><span>${catOf("e",k)[0]} ${esc(k)}</span><span><b>${fmt(v)}</b> · ${Math.round(v/exp*100)}%</span></div><div class="t"><i style="width:${v/rows[0][1]*100}%"></i></div></div>`).join("")+"</div>";
  $("stats").innerHTML=s;
}

function setType(t){
  type=t;catIdx=0;
  $("tE").classList.toggle("on",t==="e");$("tI").classList.toggle("on",t==="i");
  drawCats();
}
function drawCats(sel){
  const L=type==="e"?EXP:INC;
  $("cats").innerHTML=L.map((c,i)=>`<button data-i="${i}" class="${i===catIdx?"on":""}"><span>${c[0]}</span>${c[1]}</button>`).join("");
}
function openSheet(id){
  editId=id||null;
  const x=id?data.find(d=>d.id===id):null;
  $("sTitle").textContent=x?"Sửa giao dịch":"Thêm giao dịch";
  $("delBtn").style.display=x?"":"none";
  type=x?x.type:"e";
  const L=type==="e"?EXP:INC;
  catIdx=x?Math.max(0,L.findIndex(c=>c[1]===x.cat)):0;
  $("tE").classList.toggle("on",type==="e");$("tI").classList.toggle("on",type==="i");
  drawCats();
  $("amount").value=x?fmtNum(x.amount):"";
  $("note").value=x?x.note:"";
  $("date").value=x?x.date:(today().startsWith(ym())?today():ym()+"-01");
  $("bg").classList.add("show");
  if(!x)setTimeout(()=>$("amount").focus(),150);
}
const fmtNum=n=>new Intl.NumberFormat("vi-VN").format(n);
$("amount").addEventListener("input",e=>{
  const v=e.target.value.replace(/\D/g,"");
  e.target.value=v?fmtNum(+v):"";
});
$("cats").onclick=e=>{const b=e.target.closest("button");if(!b)return;catIdx=+b.dataset.i;drawCats()};
$("tE").onclick=()=>setType("e");$("tI").onclick=()=>setType("i");
$("fab").onclick=()=>openSheet();
$("cancel").onclick=()=>$("bg").classList.remove("show");
$("bg").onclick=e=>{if(e.target===$("bg"))$("bg").classList.remove("show")};
$("list").onclick=e=>{const it=e.target.closest(".item");if(it)openSheet(+it.dataset.id)};
$("save").onclick=()=>{
  const amount=+($("amount").value.replace(/\D/g,""))||0;
  if(!amount){$("amount").focus();return}
  const cat=(type==="e"?EXP:INC)[catIdx][1];
  const rec={type,amount,cat,note:$("note").value.trim(),date:$("date").value||today()};
  let r;
  if(editId){r=data.find(d=>d.id===editId);Object.assign(r,rec)}
  else{r={id:Date.now(),...rec};data.push(r)}
  save();cloud("set",r);
  const [y,m]=rec.date.split("-");cur=new Date(+y,+m-1,1);
  $("bg").classList.remove("show");render();
};
$("delBtn").onclick=()=>{
  if(!confirm("Xoá giao dịch này?"))return;
  data=data.filter(d=>d.id!==editId);save();cloud("del",editId);$("bg").classList.remove("show");render();
};
$("prev").onclick=()=>{cur.setMonth(cur.getMonth()-1);render()};
$("next").onclick=()=>{cur.setMonth(cur.getMonth()+1);render()};
function setTab(n){tab=n;$("t1").classList.toggle("on",n===1);$("t2").classList.toggle("on",n===2);$("list").style.display=n===1?"":"none";$("stats").style.display=n===2?"":"none"}
$("t1").onclick=()=>setTab(1);$("t2").onclick=()=>setTab(2);

// menu / export
$("menuBtn").onclick=()=>$("bg2").classList.add("show");
$("close2").onclick=()=>$("bg2").classList.remove("show");
$("bg2").onclick=e=>{if(e.target===$("bg2"))$("bg2").classList.remove("show")};
function download(name,text,mime){
  const a=document.createElement("a");
  a.href=URL.createObjectURL(new Blob([text],{type:mime}));a.download=name;
  document.body.appendChild(a);a.click();a.remove();
}
$("exCsv").onclick=()=>{
  const q=s=>'"'+String(s).replace(/"/g,'""')+'"';
  const rows=[["Ngày","Loại","Danh mục","Số tiền","Ghi chú"],...[...data].sort((a,b)=>a.date.localeCompare(b.date)).map(x=>[x.date,x.type==="e"?"Chi":"Thu",x.cat,x.amount,x.note])];
  download("chi-tieu.csv","﻿"+rows.map(r=>r.map(q).join(",")).join("\n"),"text/csv");
};
$("exJson").onclick=()=>download("so-chi-tieu-"+today()+".json",JSON.stringify(data),"application/json");
$("imJson").onclick=()=>$("file").click();
$("file").onchange=e=>{
  const f=e.target.files[0];if(!f)return;
  const r=new FileReader();
  r.onload=()=>{
    try{
      const d=JSON.parse(r.result);
      if(!Array.isArray(d)||!d.every(x=>x&&typeof x.amount==="number"&&typeof x.date==="string"&&(x.type==="e"||x.type==="i")))throw 0;
      if(confirm("Thay thế dữ liệu hiện tại bằng "+d.length+" giao dịch trong file?")){data=d.map(x=>({id:x.id||Date.now()+Math.random(),type:x.type,amount:x.amount,cat:String(x.cat||"Khác"),note:String(x.note||""),date:x.date}));save();cloud("replaceAll",data);render();$("bg2").classList.remove("show")}
    }catch(_){alert("File không hợp lệ.")}
    e.target.value="";
  };
  r.readAsText(f);
};
$("clearAll").onclick=()=>{if(confirm("Xoá TOÀN BỘ dữ liệu? Không thể hoàn tác.")){data=[];save();cloud("replaceAll",[]);render();$("bg2").classList.remove("show")}};

// đồng bộ Google Sheets
function cloudUI(){
  const c=window.cloud,on=!!(c&&c.connected);
  $("cloudBtn").textContent=on?"☁️ Google Sheets: đã kết nối":"☁️ Đồng bộ Google Sheets (chưa kết nối)";
  $("authForm").style.display=on||!c?"none":"";
  $("authOut").style.display=on?"":"none";
  $("cloudInfo").textContent=!c?"Đang tải…":on?"Dữ liệu tự đồng bộ với Google Sheet của bạn, và vẫn ghi được khi mất mạng.":"Dán link Apps Script và mã bí mật (xem SHEETS-SETUP.md). Dữ liệu trên máy sẽ được đẩy lên Sheet.";
  $("cloudMsg").textContent=c&&c.status||"";
}
window.addEventListener("cloudstate",cloudUI);
$("cloudBtn").onclick=()=>{$("bg2").classList.remove("show");cloudUI();$("bg3").classList.add("show")};
$("close3").onclick=()=>$("bg3").classList.remove("show");
$("bg3").onclick=e=>{if(e.target===$("bg3"))$("bg3").classList.remove("show")};
$("connBtn").onclick=async()=>{
  const u=$("gUrl").value.trim(),t=$("gTok").value.trim();
  if(!u||!t){$("cloudMsg").textContent="Nhập link và mã bí mật.";return}
  $("cloudMsg").textContent="Đang kết nối…";
  try{await window.cloud.connect(u,t);$("gTok").value=""}
  catch(e){$("cloudMsg").textContent=e.message}
};
$("syncBtn").onclick=()=>window.cloud.sync();
$("logoutBtn").onclick=()=>{if(confirm("Ngắt kết nối? Dữ liệu trên máy và trên Sheet vẫn giữ nguyên."))window.cloud.disconnect()};
cloudUI();

render();
if("serviceWorker" in navigator)navigator.serviceWorker.register("sw.js").catch(()=>{});
</script>
<script src="sync.js"></script>
</body>
</html>
